<!DOCTYPE html>
<html>
<head>
  <meta content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0" name="viewport">
  <meta content="yes" name="apple-mobile-web-app-capable">
  <meta content="yes" name="apple-touch-fullscreen">
  <meta content="black" name="apple-mobile-web-app-status-bar-style">
  <meta content="320" name="MobileOptimized">
  <meta charset="utf-8">
  <title>加载中</title>
<style>
    body { margin:0; padding:0; overflow:hidden; background-color:#ffffff; }
    .loader-container { position:fixed; width:100%; height:100%; display:flex; justify-content:center; align-items:center; z-index:9999; }
    .loader { position:relative; width:200px; height:200px; }
    .circle-outer { position:absolute; width:180px; height:180px; border-radius:50%; border:2px solid transparent; border-top-color:#6366F1; border-bottom-color:#A855F7; top:10px; left:10px; animation:spin 2s linear infinite; }
    .circle-middle { position:absolute; width:140px; height:140px; border-radius:50%; border:2px dashed rgba(99,102,241,.3); top:30px; left:30px; animation:spin 3s linear infinite reverse; }
    .circle-inner { position:absolute; width:100px; height:100px; border-radius:50%; border:2px solid rgba(168,85,247,.3); top:50px; left:50px; animation:pulse 2s ease-in-out infinite; }
    .cube { position:absolute; width:50px; height:50px; top:75px; left:75px; transform-style:preserve-3d; animation:rotate 4s ease-in-out infinite; }
    .cube-face { position:absolute; width:50px; height:50px; background:linear-gradient(135deg,#6366F1,#A855F7); opacity:.9; box-shadow:0 0 15px rgba(99,102,241,.5); }
    .cube-face:nth-child(1){transform:translateZ(25px);}
    .cube-face:nth-child(2){transform:rotateY(180deg) translateZ(25px);}
    .cube-face:nth-child(3){transform:rotateY(90deg) translateZ(25px);}
    .cube-face:nth-child(4){transform:rotateY(-90deg) translateZ(25px);}
    .cube-face:nth-child(5){transform:rotateX(90deg) translateZ(25px);}
    .cube-face:nth-child(6){transform:rotateX(-90deg) translateZ(25px);}
    .dots { position:absolute; width:200px; height:200px; }
    .dot { position:absolute; width:8px; height:8px; border-radius:50%; background-color:rgba(99,102,241,.8); box-shadow:0 0 5px rgba(99,102,241,.5); }
    .dot:nth-child(1){top:30px;left:96px;animation:float 3s ease-in-out infinite;}
    .dot:nth-child(2){top:96px;left:30px;animation:float 3s ease-in-out infinite .5s;}
    .dot:nth-child(3){top:96px;right:30px;animation:float 3s ease-in-out infinite 1s;}
    .dot:nth-child(4){bottom:30px;left:96px;animation:float 3s ease-in-out infinite 1.5s;}
    @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
    @keyframes pulse { 0%,100%{transform:scale(1);opacity:.7} 50%{transform:scale(1.1);opacity:1} }
    @keyframes rotate { 0%,100%{transform:rotateX(0deg) rotateY(0deg)} 25%{transform:rotateX(90deg) rotateY(45deg)} 50%{transform:rotateX(180deg) rotateY(90deg)} 75%{transform:rotateX(270deg) rotateY(135deg)} }
    @keyframes float { 0%,100%{transform:translateY(0);opacity:.5} 50%{transform:translateY(-15px);opacity:1} }
    .content { height:100%; width:100%; position:fixed; left:-2px; top:-2px; }
    .status { position:absolute; bottom:-70px; left:50%; transform:translateX(-50%); font-family:Arial,sans-serif; font-size:14px; color:#888; white-space:nowrap; }
    .err-box { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
               background:linear-gradient(135deg,#EEF2FF 0%,#FAF5FF 100%); z-index:10000; overflow:auto; padding:24px; }
    .err-card { text-align:center; background:rgba(255,255,255,.85); backdrop-filter:blur(10px);
                border-radius:20px; box-shadow:0 20px 60px rgba(99,102,241,.18); padding:48px 40px; max-width:90%; width:360px; }
    .err-icon { width:72px; height:72px; margin:0 auto 18px; border-radius:50%;
                display:flex; align-items:center; justify-content:center;
                background:linear-gradient(135deg,#6366F1,#A855F7); box-shadow:0 10px 25px rgba(99,102,241,.35); }
    .err-card h2 { margin:0 0 10px; color:#1e1b4b; font-size:20px; font-family:Arial,"Microsoft YaHei",sans-serif; }
    .err-card p { margin:0; color:#6b7280; font-size:14px; line-height:1.7; font-family:Arial,"Microsoft YaHei",sans-serif; word-break:break-all; }
</style>
</head>
<body>

<div class="loader-container" id="loader">
    <div class="loader">
        <div class="circle-outer"></div>
        <div class="circle-middle"></div>
        <div class="circle-inner"></div>
        <div class="cube">
            <div class="cube-face"></div><div class="cube-face"></div><div class="cube-face"></div>
            <div class="cube-face"></div><div class="cube-face"></div><div class="cube-face"></div>
        </div>
        <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        <div class="status" id="status">正在加载...</div>
    </div>
</div>

<script>
/* ═══════════════ 配置区（部署时修改） ═══════════════
 * MASTER_API        ：主站统一 API 地址（api.php，含 action=whitelist / verify_link / report）
 * API_TOKEN         ：主站后台配置的 secret 密钥（与旧版 WHITELIST_URL 中的 token 一致）
 * INTERFACE_API_URL ：本接口在主站「短链接口管理」中登记的完整地址（与生成时所选接口一致）
 * 示例：const MASTER_API = "https://fh.1945.fit/api.php";
 */
const MASTER_API        = "https://yechuan.149-88-82-183.nip.io/api.php";
const API_TOKEN         = "yechuan";
const INTERFACE_API_URL = "https://app-fp29u66wtji9.miaoda.online/api_type2.html";
/* ═══════════════════════════════════════════════════ */

// 友好错误页（渐变背景 + 毛玻璃卡片）
function showError(msg, sub) {
    document.getElementById("loader").style.display = "none";
    document.body.style.overflow = "auto";
    document.body.innerHTML =
        '<div class="err-box"><div class="err-card">'
      + '<div class="err-icon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
      + '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>'
      + '<h2>访问受限</h2>'
      + '<p>' + msg + (sub ? '<br><small style="color:#9ca3af">' + sub + '</small>' : '') + '</p>'
      + '</div></div>';
}

// 判断域名是否在授权列表中（精确匹配或子域名匹配，兼容泛授权）——原有功能保留
function isDomainInWhitelist(hostname, whitelist) {
    hostname = hostname.toLowerCase();
    return whitelist.some(function (domain) {
        return hostname === domain || hostname.endsWith('.' + domain);
    });
}

function getHostname(url) {
    var a = document.createElement('a');
    a.href = url;
    return a.hostname;
}

// 上报接口侧本地拦截到主站拦截日志面板（尽力而为，失败不影响拒绝结果）
function reportBlock(reason, code, url) {
    try {
        var q = MASTER_API
              + "?action=report&token=" + encodeURIComponent(API_TOKEN)
              + "&reason=" + encodeURIComponent(reason)
              + "&code=" + encodeURIComponent(code || '')
              + "&url=" + encodeURIComponent(String(url || '').slice(0, 500))
              + "&api_base=" + encodeURIComponent(INTERFACE_API_URL);
        fetch(q).catch(function(){});
    } catch (e) { /* 忽略上报异常 */ }
}

(async () => {
    /* ── 1. 解析访问链接中的 yc 特征码段 ── */
    const params = new URLSearchParams(window.location.search);
    const rawParam = params.get('api') || params.get('url') || '';
    let seg = '';
    if (rawParam) {
        if (rawParam.startsWith('yc/')) {
            seg = rawParam.slice(3);          // ?api=yc/码.编码串
        } else if (rawParam.startsWith('/yc/')) {
            seg = rawParam.slice(4);          // ?api=/yc/码.编码串
        } else {
            reportBlock('old_format', '', rawParam);
            showError("该链接并未经系统生成", "链接缺少有效特征码，请通过系统正常生成后使用");
            return;
        }
    } else {
        const uri = window.location.pathname + window.location.search;
        const pos = uri.indexOf('/yc/');
        if (pos === -1) {
            reportBlock('old_format', '', uri);
            showError("该链接并未经系统生成", "链接缺少有效特征码，请通过系统正常生成后使用");
            return;
        }
        seg = uri.slice(pos + 4);
    }
    seg = seg.split(/[?#]/)[0];

    if (seg.length < 8 || seg[6] !== '.') {
        reportBlock('invalid_format', seg.slice(0, 6), seg);
        showError("链接格式无效", "特征码段无法解析");
        return;
    }
    const code = seg.slice(0, 6);
    const enc  = seg.slice(7);

    // URL-safe Base64 解码（'-_'→'+/'，补齐 padding）
    let b64 = enc.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4 !== 0) b64 += '=';

    let targetUrl;
    try { targetUrl = atob(b64); } catch (e) {
        reportBlock('decode_fail', code, enc);
        showError("无效的Base64编码");
        return;
    }
    if (!targetUrl || !/^https?:\/\//i.test(targetUrl)) {
        reportBlock('decode_fail', code, enc);
        showError("无效URL");
        return;
    }

    /* ── 2. 第一阶段：拉取远程白名单校验域名授权（原有功能保留） ── */
    let whitelist;
    try {
        const response = await fetch(MASTER_API + "?action=whitelist&token=" + encodeURIComponent(API_TOKEN));
        if (!response.ok) throw new Error("HTTP " + response.status);
        whitelist = await response.json();
        if (!Array.isArray(whitelist)) throw new Error("格式错误");
    } catch (error) {
        console.error("加载授权列表失败:", error);
        showError("授权服务暂时不可用，请稍后再试", "如持续出现请联系站长处理");
        return;
    }

    const finalHostname = getHostname(targetUrl);
    if (!isDomainInWhitelist(finalHostname, whitelist)) {
        console.error("域名未授权:", finalHostname);
        reportBlock('domain_unauthorized', code, targetUrl);
        showError("该域名未授权", "域名 " + finalHostname + " 尚未获得授权");
        return;
    }

    /* ── 3. 第二阶段：特征码三元组远程校验（主站 api.php?action=verify_link） ── */
    document.getElementById("status").textContent = "正在校验...";
    let ver;
    try {
        const vq = MASTER_API
                 + "?action=verify_link&token=" + encodeURIComponent(API_TOKEN)
                 + "&code=" + encodeURIComponent(code)
                 + "&url=" + encodeURIComponent(targetUrl)
                 + "&api_base=" + encodeURIComponent(INTERFACE_API_URL);
        const vRes = await fetch(vq);
        if (!vRes.ok) throw new Error("HTTP " + vRes.status);
        ver = await vRes.json();
    } catch (error) {
        console.error("特征码校验失败:", error);
        showError("校验服务暂时不可用，请稍后再试", "已拒绝加载内容，如持续出现请联系站长处理");
        return;
    }
    if (!ver || ver.ok !== true) {
        showError(ver && ver.msg ? ver.msg : "该链接并未经系统生成或绑定的接口不正确",
                  "如确需使用请前往系统正常生成");
        return;
    }

    /* ── 4. 双阶段校验全部通过，内嵌加载原始链接（主站返回的记录URL） ── */
    document.getElementById("status").textContent = "加载完成";
    document.getElementById("loader").style.display = "none";
    var html = '<iframe class="content" src="' + (ver.url || targetUrl) + '" style="width:100%; height:100vh; border:none;" allowfullscreen></iframe>';
    document.body.innerHTML += html;
})();
</script>
</body>
</html>
